name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake gcc g++ gfortran

      - name: Cache dep/
        id: cache-dep
        uses: actions/cache@v4
        with:
          path: dep/
          key: dep-${{ runner.os }}-${{ hashFiles('setup') }}

      - name: Build dependencies
        if: steps.cache-dep.outputs.cache-hit != 'true'
        run: ./setup

      - name: Build FES
        run: make build

      - name: Test
        run: make test
